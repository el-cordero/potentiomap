name: extended-tests.yaml

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions: read-all

jobs:
  extended-synthetic:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: -j2
      _R_CHECK_LIMIT_CORES_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::xml2
          needs: check
      - name: Complete integration analysis
        run: source("dev/integration-tests/complete-synthetic.R")
        shell: Rscript {0}
      - name: Extended stress tests
        run: source("dev/stress-tests/run-stress.R")
        shell: Rscript {0}
