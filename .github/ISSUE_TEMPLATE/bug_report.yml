name: Bug report
description: Report reproducible incorrect package behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not upload confidential well coordinates, client data, private site identifiers, or restricted environmental data. Replace them with a small synthetic example.
  - type: input
    id: version
    attributes:
      label: potentiomap version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: r-version
    attributes:
      label: R version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: input-class
    attributes:
      label: Input class
      description: For example, data.frame, sf, SpatVector, or SpatRaster.
    validations:
      required: true
  - type: input
    id: crs
    attributes:
      label: Coordinate reference system
    validations:
      required: true
  - type: input
    id: head-unit
    attributes:
      label: Groundwater-head unit
    validations:
      required: true
  - type: input
    id: vertical-datum
    attributes:
      label: Vertical datum, when known
  - type: textarea
    id: call
    attributes:
      label: Relevant function call
      render: r
    validations:
      required: true
  - type: textarea
    id: reprex
    attributes:
      label: Smallest reproducible example
      description: Use synthetic data and include all objects needed to run it.
      render: r
    validations:
      required: true
  - type: textarea
    id: condition
    attributes:
      label: Complete warning or error
      render: text
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: sessionInfo()
      render: text
    validations:
      required: true
