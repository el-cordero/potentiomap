articles:
  - title: Start here
    contents:
      - articles/quick-start
  - title: Prepare observations
    contents:
      - articles/preparing-observations
      - articles/input-formats-crs
  - title: Build surfaces
    contents:
      - articles/interpolation-methods
      - articles/interpolation-parameters
      - articles/custom-interpolation
      - articles/contours-smoothing
      - articles/contour-support-thresholds
  - title: Create products
    contents:
      - articles/flow-arrows
      - articles/exporting-products
      - articles/repeated-events
  - title: Applied examples
    contents:
      - articles/real-world-usgs
      - articles/output-gallery
  - title: 0.2.0 guides
    contents:
      - getting-started
      - diagnostics-and-support
      - contours-and-arrows
      - units-and-groups
  - title: Scientific guidance
    contents:
      - articles/interpretation-limitations
      - articles/troubleshooting
