url: https://el-cordero.github.io/potentiomap/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#1F5E6B"
    link-color: "#176B87"
  opengraph:
    image:
      src: man/figures/social-preview.png
      alt: >
        potentiomap logo beside stylized blue-to-red potentiometric contours
        and the tagline reproducible groundwater surfaces in R.

home:
  title: "potentiomap: reproducible potentiometric surfaces in R"
  description: >
    Prepare groundwater observations, interpolate potentiometric surfaces,
    review diagnostics and prediction support, and create GIS-ready contours
    and hydraulic-gradient symbols.

repo:
  branch: main
  url:
    home: https://github.com/el-cordero/potentiomap/
    issue: https://github.com/el-cordero/potentiomap/issues/

navbar:
  bg: primary
  type: dark
  structure:
    left: [home, getstarted, examples, guides, reference, news]
    right: [search, cran, github, lightswitch]
  components:
    home:
      text: Home
      href: index.html
    getstarted:
      text: Get started
      href: articles/quick-start.html
    examples:
      text: Examples
      menu:
        - text: Start here
        - text: Five-minute quick start
          href: articles/quick-start.html
        - text: Complete groundwater-surface workflow
          href: articles/complete-synthetic-aquifer.html
        - text: Prepare observations
        - text: Preparing groundwater observations
          href: articles/preparing-observations.html
        - text: Input formats and coordinate systems
          href: articles/input-formats-crs.html
        - text: Build surfaces
        - text: Compare interpolation methods
          href: articles/interpolation-methods.html
        - text: Interpolation parameters
          href: articles/interpolation-parameters.html
        - text: Custom interpolation functions
          href: articles/custom-interpolation.html
        - text: Contours and smoothing
          href: articles/contours-smoothing.html
        - text: Compare contour-support thresholds
          href: articles/contour-support-thresholds.html
        - text: Create products
        - text: Hydraulic-gradient arrows
          href: articles/flow-arrows.html
        - text: Export GIS-ready products
          href: articles/exporting-products.html
        - text: Repeated monitoring events
          href: articles/repeated-events.html
        - text: Applied examples
        - text: Public USGS groundwater example
          href: articles/real-world-usgs.html
        - text: Output gallery
          href: articles/output-gallery.html
        - text: Browse all articles
          href: articles/index.html
    guides:
      text: Guides
      menu:
        - text: 0.2.0 feature guide
